# 合并到 guangnian.xin/www.guangnian.xin 的官网 server 块。
# 宝塔当前通过 extension/www.guangnian.xin/*.conf 加载；保留证书验证路径。
# www 使用 308 保留 POST 请求的方法与正文，避免影响仍访问旧主机名的表单。
set $mono_seo_www_redirect 0;
if ($host = www.guangnian.xin) { set $mono_seo_www_redirect 1; }
if ($uri ~ "^/\.well-known/") { set $mono_seo_www_redirect 0; }
if ($mono_seo_www_redirect = 1) { return 308 https://guangnian.xin$request_uri; }

# 只归并静态官网的显式 index.html；使用原始 request_uri 避免目录首页内部重定向循环。
# 商品、账号和支付入口的查询参数继续由 ShopXO 处理。
if ($request_uri ~ "^(/(?:services/|products/(?:[a-z0-9-]+/)?|about/|contact/|lab/|guides/(?:[a-z0-9-]+/)?|service-terms/)?)index\.html(?:\?|$)") {
    return 301 https://guangnian.xin$1$is_args$args;
}

# 正文优先返回真实静态文件；无效地址保留 404 状态，并使用官网错误页。
location / {
    try_files $uri $uri/ =404;
    error_page 404 /404/index.html;
    expires -1;
}

location ~ ^/(?:llms(?:-full)?|robots|indexnow)\.txt$ {
    try_files $uri =404;
    default_type text/plain;
    charset utf-8;
    expires -1;
}

location ~ ^/guides/([a-z0-9-]+)/index\.md$ {
    try_files $uri =404;
    default_type text/markdown;
    charset utf-8;
    add_header Link '<https://guangnian.xin/guides/$1/>; rel="canonical"';
    add_header Strict-Transport-Security "max-age=31536000" always;
    expires -1;
}
