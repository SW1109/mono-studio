display_errors=Off
display_startup_errors=Off
log_errors=On
expose_php=Off
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_secure=1
session.cookie_httponly=1
session.cookie_samesite=Lax
; Defence in depth for CVE-2026-109619; upgrading PHP is still required.
; Apply in the real php.ini or FPM pool before request parsing, then restart all workers.
session.upload_progress.enabled=0
; Used by PHP 8.5; harmless on earlier branches.
fatal_error_backtraces=0
allow_url_include=Off
upload_max_filesize=10M
post_max_size=12M
