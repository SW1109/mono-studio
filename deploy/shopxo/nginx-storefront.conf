# 合并到官网 server 块。商城源码仍在独立目录，后台仍使用独立管理域名。
# 此处路径和 PHP socket 对应当前宝塔实例；其他服务器须先核对。
location = /shop { return 308 /shop/; }
location = /orders/ { return 302 /shop/index.php?s=/order/index; }
location ^~ /shop/ {
    alias /www/wwwroot/order.guangnian.xin/;
    index index.php;
    client_max_body_size 20m;

    location ~ ^/shop/(?:app|config|extend|vendor|runtime|route|artifacts|backups|secrets)(?:/|$) { return 404; }
    location = /shop/think { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:sql|sqlite|sqlite3|bak|env)$ { return 404; }
    location ~* ^/shop/[^/]+\.(?:json|md|conf|lock|txt|env|sql|sqlite|sqlite3|bak|zip|gz)$ { return 404; }

    # 使用固定入口白名单；SCRIPT_NAME 保留 /shop/，使链接、会话及支付回调使用同域子路径。
    location ~ ^/shop/(?<mono_store_entry>index|api|payment_default_order_(?:alipay|jeepayalipay|epaylinksalipay)_(?:respond|notify))\.php$ {
        if (!-f /www/wwwroot/order.guangnian.xin/$mono_store_entry.php) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/order.guangnian.xin/$mono_store_entry.php;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_read_timeout 60s;
    }
    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) { return 404; }
    try_files $uri $uri/ /shop/index.php?$query_string;
}
