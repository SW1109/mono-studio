# 安装完成后使用：合并到商城 server 块，放在宝塔通用 PHP include 之前。
# 不替换宝塔的 TLS、PHP socket 或整份站点配置；合并后必须先执行 nginx -t。
autoindex off;

location = /install.php { return 404; }
location = /public/install.php { return 404; }
location ~ ^/(?:app|config|extend|vendor|runtime|route|artifacts|backups|secrets)(?:/|$) { return 404; }
location ~ /\.(?!well-known(?:/|$)) { return 404; }
location ~* ^/(?:example\.env|composer\.(?:json|lock)|think|README\.md|LICENSE\.txt|changelog\.txt|MONO-STUDIO-(?:PREVIEW|PAYMENTS)\.php|MONO-STUDIO-SETUP\.md|MONO-NGINX-SECURITY\.conf|mono-(?:source-manifest|service-catalog|site-navigation)\.json)$ { return 404; }
location ~* \.(?:sql|sqlite|sqlite3|bak|env)$ { return 404; }
location ~* ^/mono-(?:studio|order-center)[^/]*\.(?:tar(?:\.gz)?|zip)$ { return 404; }

# 上传路径兼容根目录和 /public/ 前缀；此规则需在通用 PHP location 之前。
location ~* ^/(?:public/)?static/upload/.*\.(?:php[0-9]*|phtml|phar)(?:/|$) { return 404; }

# 若站点使用 PHP 入口白名单，需在最终 PHP 拒绝规则之前执行以下原生回调入口：
# ^/payment_default_order_(?:alipay|jeepayalipay|epaylinksalipay)_(?:respond|notify)\.php$
# 使用与 index.php 相同的 FastCGI 配置和 try_files $uri =404；不要放开上传目录 PHP。
