# Merge into the order center HTTPS server. Use <order-center>/public as its root.
# Keep these rules before a generic PHP regex location. Do not replace TLS settings.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location ~ /\.(?!well-known(?:/|$)) { deny all; }
location ~* ^/(?:config|vendor|runtime|extend|sourcecode|rsakeys|backup|backups|\.git)(?:/|$) { return 404; }
location ~* \.(?:sql|sqlite|sqlite3|env|ini|log|bak|pem|key|phar)(?:$|/) { return 404; }
location = /mono-payments.php { return 404; }
location = /php-runtime-check.php { return 404; }
location = /php-security-policy.json { return 404; }
location ~* ^/static/upload/.*\.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh)(?:$|/) { return 404; }

# Once installation has completed, deny the installer routes and keep the install lock.
location = /install.php { return 404; }
# Query-string routes must also be denied; location alone does not inspect ?s=.
if ($arg_s ~* "^/?install(?:/|$)") { return 404; }

# Payment notifications must remain reachable. Apply callback-specific rate limits
# at the reverse proxy/WAF; do not attach an administrator IP allowlist to /api/.
